providers:
  magpie:
    baseUrl: http://127.0.0.1:3425/v1
    api: openai-responses
    auth: none
    headers:
      User-Agent: omp
    compat:
      promptCacheSessionHeader: x-session-affinity
    models:
      - id: codex/gpt-6.1-sol
        name: GPT-6.1-Sol
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
        input: [text, image]
        contextWindow: 872000
        maxTokens: 128000
        cost:
          input: 2
          output: 10
          cacheRead: 0.1
          cacheWrite: 2.5
      - id: codex/gpt-6-astra
        name: GPT-6-Astra
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
        input: [text, image]
        contextWindow: 872000
        maxTokens: 128000
        cost:
          input: 10
          output: 50
          cacheRead: 1
          cacheWrite: 12.5
