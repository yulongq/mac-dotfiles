{{- /* chezmoi:modify-template */ -}}
{{- $selection := includeTemplate "execution-mode" . | fromJson -}}
{{- $managed := includeTemplate "codex/config.toml" . | fromToml -}}
{{- $stdin := .chezmoi.stdin -}}
{{- $current := $stdin | fromToml -}}
{{- $out := deepCopy $current -}}
{{- if $selection.baseline -}}
  {{- $out = mergeOverwrite $out $managed -}}
  {{- $out = set $out "plugins" (get $managed "plugins") -}}
  {{- /* Replace source-declared servers. Desktop owns node_repl's environment. */ -}}
  {{- range $name, $server := get $managed "mcp_servers" -}}
    {{- if eq $name "node_repl" -}}
      {{- $live := get (get $current "mcp_servers" | default dict) $name | default dict -}}
      {{- range $key := list "env" "env_vars" -}}
        {{- if hasKey $live $key -}}{{- $server = set $server $key (get $live $key) -}}{{- end -}}
      {{- end -}}
    {{- end -}}
    {{- $out = setValueAtPath (list "mcp_servers" $name) $server $out -}}
  {{- end -}}
{{- end -}}
{{- $profile := get $managed "default_permissions" -}}
{{- $out = setValueAtPath (list "permissions" $profile) (index $managed "permissions" $profile) $out -}}
{{- if or (eq $selection.mode "host") (and (eq $selection.mode "") (eq (get $current "default_permissions") ":danger-full-access")) -}}
  {{- $profile = ":danger-full-access" -}}
{{- end -}}
{{- $out = set $out "default_permissions" $profile -}}
{{- /* Legacy selectors can take precedence over the selected profile. */ -}}
{{- $out = omit $out "sandbox_mode" "sandbox_workspace_write" -}}
{{- if deepEqual $current $out -}}
  {{- $stdin -}}
{{- else -}}
  {{- $out | toToml -}}
{{- end -}}
