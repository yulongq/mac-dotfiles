{{- /* chezmoi:modify-template */ -}}
{{- $settings := includeTemplate "omp/config.yml" . | fromYaml -}}
{{- $stdin := .chezmoi.stdin -}}
{{- $current := dict -}}
{{- if $stdin -}}{{- $current = fromYaml $stdin -}}{{- end -}}
{{- $out := mergeOverwrite (deepCopy $current) $settings -}}
{{- if deepEqual $current $out -}}
  {{- $stdin -}}
{{- else -}}
  {{ toYaml $out }}
{{- end -}}
