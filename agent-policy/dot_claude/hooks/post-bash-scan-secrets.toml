[extend]
useDefault = true

# Shell output also contains credentials without a vendor prefix. Exclude shell
# interpolation and angle-bracket placeholders while preserving those warnings.
[[rules]]
id = "authorization-header"
description = "Credential in an Authorization header"
regex = '''(?i)\bauthorization\\?["']?\s*:\s*\\?["']?(?:basic\s+([A-Za-z0-9+/]{8,}={0,2})|(?:(?:apikey|bearer|token)\s+)?([A-Za-z0-9._~+/=-]{16,}))'''
keywords = ["authorization"]

[[rules]]
id = "custom-auth-header"
description = "Credential in a custom authentication header"
regex = '''(?i)\b(?:x-api-key|x-auth-token)\\?["']?\s*:\s*\\?["']?([A-Za-z0-9._~+/=-]{16,})'''
keywords = ["x-api-key", "x-auth-token"]

[[rules]]
id = "bearer-value"
description = "Standalone Bearer credential"
regex = '''(?i)\bbearer\s+([A-Za-z0-9._~+/=-]{20,})'''
keywords = ["bearer"]

[[rules]]
id = "credential-assignment"
description = "Named credential assignment in shell output"
regex = '''(?i)\b(?:[a-z_][a-z0-9_]*_)?(?:token|secret|password|credential|api_key|auth|private_key)=["']?([A-Za-z0-9._~+/=-]{16,})'''
keywords = ["token", "secret", "password", "credential", "api_key", "auth", "private_key"]

[[rules]]
id = "uri-credential"
description = "Password embedded in a URL"
regex = '''\b[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@]*:([^\s/@<$][^\s/@]{7,})@[^\s/]+'''
secretGroup = 1
keywords = ["://"]
